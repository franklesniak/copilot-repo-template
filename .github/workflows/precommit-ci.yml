# Pre-commit CI Workflow
#
# Purpose: Run the aggregate `pre-commit run --all-files` gate for every
# active hook in `.pre-commit-config.yaml`.
#
# This workflow is baseline-scoped so downstream repositories can keep
# repository hygiene enforcement even when they exclude Python project source.
# Python is still installed as the runner for pre-commit itself and for
# Python-based hooks such as check-jsonschema and repo-local wrappers.
#
# Hook coverage:
#   - General hygiene (trailing-whitespace, end-of-file-fixer,
#     check-added-large-files)
#   - JSON/TOML/YAML syntax and YAML style
#   - GitHub Actions workflow linting
#   - JSON Schema validation
#   - Markdown linting
#   - Module-specific hooks retained by the downstream sync
#
# Note: This workflow is optional only if the repository removes pre-commit
# entirely or replaces aggregate hook enforcement with an equivalent gate.

name: Pre-commit CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements-pre-commit.txt

      # template-sync: begin terraform-only
      # Install Terraform for repo-local Terraform pre-commit hooks.
      # Version Policy: Use the latest stable Terraform version for pre-commit.
      # Review and update quarterly per TEMPLATE_MAINTENANCE.md.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.4"

      # Install TFLint for the repo-local terraform-tflint pre-commit hook.
      # Keep this tflint_version aligned with every other tflint_version input
      # passed to terraform-linters/setup-tflint under .github/workflows/.
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: "v0.51.1"
      # template-sync: end terraform-only

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'requirements-pre-commit.txt') }}

      - name: Install pre-commit
        shell: python
        run: |
          import re
          import subprocess
          import sys
          from pathlib import Path

          requirement = Path("requirements-pre-commit.txt").read_text(encoding="utf-8").strip()
          if re.fullmatch(r"pre-commit==[0-9]+\.[0-9]+\.[0-9]+", requirement) is None:
              raise SystemExit("requirements-pre-commit.txt must contain one exact pre-commit pin")
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--requirement", "requirements-pre-commit.txt"],
              check=True,
          )
          expected = requirement.replace("==", " ", 1)
          actual = subprocess.check_output(["pre-commit", "--version"], text=True).strip()
          if actual != expected:
              raise SystemExit(f"pre-commit version mismatch: expected {expected}, got {actual}")
          print(actual)

      - name: Run pre-commit hooks
        # Runs every hook in .pre-commit-config.yaml. Required system tools
        # are set up above; other hooks provision their own environments
        # inside pre-commit's hook cache.
        run: pre-commit run --all-files
