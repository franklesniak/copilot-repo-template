# Independently enforce the GitHub Actions module without language scaffolds.
name: Workflow Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Workflow Security
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install validator dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Validate workflow security
        run: python .github/scripts/validate_workflow_security.py
