version: 1
workflows:
  .github/workflows/auto-fix-precommit.yml:
    events:
      push:
        branches:
          - copilot/**
    defaults: {}
    env: {}
    jobs:
      fix-preview:
        controls:
          if: github.actor == 'copilot-swe-agent[bot]'
          runs-on: ubuntu-latest
          timeout-minutes: 30
        steps:
          - name: Checkout code
            with:
              ref: ${{ github.sha }}
              persist-credentials: false
            action: actions/checkout
          - name: Set up Python
            with:
              python-version: '3.14'
            action: actions/setup-python
          - name: Setup Node.js for nested Markdown
            with:
              node-version: '24'
              cache: npm
              cache-dependency-path: package-lock.json
            action: actions/setup-node
          - name: Install root Markdown dependencies
            run_sha256: e568f48e4564d1ada4a272f93f6e94a1db7c70212a765c414a6ec92d2a889e21
          - name: Setup Terraform
            with:
              terraform_version: 1.14.4
            action: hashicorp/setup-terraform
          - name: Setup TFLint
            with:
              tflint_version: v0.51.1
            action: terraform-linters/setup-tflint
          - name: Install pre-commit
            shell: python
            run_sha256: 7acffd8be7b89e167121a560bbd121fed99e81f35f4af5f84fec046e3c513a82
          - name: Run pre-commit hooks
            id: hooks
            continue-on-error: true
            run_sha256: 3397a95d1b40ee4e35cec2ac32ab99a649893be3f90a114dcfcb2ea2c6bb77ac
          - name: Capture untrusted fix preview
            id: preview
            if: ${{ !cancelled() && (steps.hooks.outcome == 'success' || steps.hooks.outcome == 'failure') }}
            shell: python
            env:
              HOOK_EXIT: ${{ steps.hooks.outputs.exit_code }}
            run_sha256: 5ce4a9f59d5fc0781a3e10cdd61c812bc375cb954fad110a6d1eb5f39d5098ff
          - name: Upload untrusted fix preview
            if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
            with:
              name: untrusted-precommit-fix-preview-${{ github.run_id }}-${{ github.run_attempt }}
              path: '${{ runner.temp }}/precommit-fix-preview/tracked.patch

                ${{ runner.temp }}/precommit-fix-preview/status.txt

                ${{ runner.temp }}/precommit-fix-preview/README.txt

                '
              if-no-files-found: error
              retention-days: 3
            action: actions/upload-artifact
          - name: Preserve pre-commit failure
            if: ${{ !cancelled() && steps.hooks.outcome == 'failure' }}
            run_sha256: e7d5230aa171477a4fa8816af18e815d13dd67a42cfced049f526a49be04c427
  .github/workflows/check-placeholders.yml:
    events:
      push: null
      pull_request: null
      workflow_dispatch: null
    defaults: {}
    env: {}
    jobs:
      check-placeholders:
